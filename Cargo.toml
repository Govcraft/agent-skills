[package]
name = "agent-skills"
version = "0.1.0"
edition = "2024"
description = "Parse, validate, and work with Agent Skills as defined by the Agent Skills specification"
license = "MIT"
repository = "https://github.com/agentskills/agent-skills-rs"
keywords = ["agent", "skills", "ai", "llm", "automation"]
categories = ["parsing", "config"]

[dependencies]
serde = { version = "1.0.228", features = ["derive"] }
serde_yaml = "0.9.34"

[dev-dependencies]
tempfile = "3.24.0"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "deny"
pedantic = "warn"
nursery = "warn"
